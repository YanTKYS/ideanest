name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IdeaNest.sln

      - name: Validate release-note version headings are unique
        shell: pwsh
        run: |
          $versions = Select-String -Path docs/release-notes.md -Pattern '^## (v[0-9]+\.[0-9]+\.[0-9]+)\b' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          $duplicates = $versions | Group-Object | Where-Object Count -gt 1
          if ($duplicates) {
            $names = ($duplicates | ForEach-Object Name) -join ', '
            throw "Duplicate release-note version headings: $names"
          }

      - name: Build (Release)
        run: dotnet build IdeaNest.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/IdeaNest.Tests/IdeaNest.Tests.csproj --configuration Release --no-build --nologo

      - name: Smoke test
        run: dotnet run --project tools/IdeaNest.Smoke/IdeaNest.Smoke.csproj --configuration Release --no-build

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IdeaNest.sln

      - name: Build (Release)
        run: dotnet build IdeaNest.sln --configuration Release --no-restore

      - name: Build smoke test
        run: dotnet build tools/IdeaNest.Smoke/IdeaNest.Smoke.csproj --configuration Release

      - name: Smoke test
        run: dotnet run --project tools/IdeaNest.Smoke/IdeaNest.Smoke.csproj --configuration Release --no-build
